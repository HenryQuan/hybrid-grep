[project]
name = "hybrid-grep"
version = "0.1.0"
description = "Wrapper around ripgrep and ast-grep for coding agents"
requires-python = ">=3.8"

[project.scripts]
hybrid-grep = "hygp.__main__:main"
hygp = "hygp.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
